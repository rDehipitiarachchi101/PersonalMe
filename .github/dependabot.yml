version: 2
updates:
  # npm packages (Astro, Prettier, TypeScript, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development

  # The GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
