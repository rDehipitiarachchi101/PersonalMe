version: 2
updates:
  # npm packages (Astro, Prettier, TypeScript, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Held at TypeScript 6: @astrojs/check 0.9.x only supports TypeScript ^5 || ^6
      # (TypeScript 7 failed npm ci in Dependabot PR #3). Remove this rule once an
      # @astrojs/check release lists TypeScript 7 in its peer dependencies.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
